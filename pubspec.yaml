name: smart_safety_badge
description: Smart Safety Badge - Flutter prototype with Firebase-ready cloud integration and BLE hardware support.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  flutter_blue_plus: ^2.3.11
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
